name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build image -> GHCR
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Dokploy redeploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Call Dokploy webhook
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::El secret DOKPLOY_WEBHOOK_URL esta vacio o no existe."
            echo "Verifica en Settings > Secrets and variables > Actions que el nombre sea exactamente DOKPLOY_WEBHOOK_URL y que el valor sea la URL completa (https://...)."
            exit 1
          fi
          response=$(curl -sS -X POST \
            -H "Content-Type: application/json" \
            -d "{\"message\": \"Deploy ${{ github.sha }} from ${{ github.ref_name }}\"}" \
            -w "\n%{http_code}" \
            "$WEBHOOK_URL")
          code=$(echo "$response" | tail -n1)
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "Dokploy webhook failed with HTTP $code"
            echo "$response"
            exit 1
          fi
          echo "Dokploy deploy triggered (HTTP $code)"
