name: Debug secrets

# Workflow de diagnostico: ejecutalo manualmente desde la pestana Actions
# para verificar que el secret DOKPLOY_WEBHOOK_URL sea visible y valido.
# Borra este archivo cuando el deploy funcione.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verificar DOKPLOY_WEBHOOK_URL
    runs-on: ubuntu-latest
    steps:
      - name: Presencia del secret
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::El secret NO es visible para este workflow."
            echo "Causas posibles: no existe, esta creado como Variable en vez de Secret,"
            echo "esta en un Environment que este job no declara, o esta en otro repo/org."
            exit 1
          fi
          echo "El secret es visible. Longitud: ${#WEBHOOK_URL} caracteres."

      - name: Formato del valor
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          case "$WEBHOOK_URL" in
            http://*|https://*) echo "Empieza con http(s):// - OK" ;;
            *) echo "::error::No empieza con http:// o https://. Pega la URL completa del webhook de Dokploy." ; exit 1 ;;
          esac
          if [ "$WEBHOOK_URL" != "$(echo "$WEBHOOK_URL" | tr -d '[:space:]')" ]; then
            echo "::error::El valor contiene espacios o saltos de linea. Vuelve a pegarlo sin ellos."
            exit 1
          fi
          if ! echo "$WEBHOOK_URL" | grep -q "/api/webhook/"; then
            echo "::warning::La URL no contiene /api/webhook/. Verifica que sea el webhook de Dokploy."
          else
            echo "Contiene /api/webhook/ - OK"
          fi
