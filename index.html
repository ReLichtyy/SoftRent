<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/softrent-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0e0d" />
    <link rel="preload" href="/src/assets/fonts/figtree-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- seo:start: scripts/prerender.mjs reemplaza este bloque por el <head> de cada ruta (src/seo/site.ts) -->
    <title>SoftRent</title>
    <!-- seo:end -->
    <script>
      // Tema oscuro por defecto; solo respeta el claro si el usuario
      // lo eligió y quedó guardado (evita el destello al primer render).
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('softrent-theme')
        } catch (e) {
          /* sin localStorage se queda en el tema oscuro */
        }
        if (t !== 'light') {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
