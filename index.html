<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/softrent-symbol.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SoftRent construye sistemas de reservas, comunicación y facturación a la medida de su negocio de servicios."
    />
    <meta name="theme-color" content="#0f0e0d" />
    <title>SoftRent - Software a la medida para su negocio</title>
    <script>
      // Tema oscuro por defecto; solo respeta el claro si el usuario
      // lo eligió y quedó guardado (evita el destello al primer render).
      ;(function () {
        var t = null
        try {
          t = localStorage.getItem('softrent-theme')
        } catch (e) {
          /* sin localStorage se queda en el tema oscuro */
        }
        if (t !== 'light') {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
