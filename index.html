<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SoftRent construye sistemas de reservas, comunicación y facturación a la medida de tu negocio de servicios."
    />
    <title>SoftRent — Software a la medida para tu negocio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Play:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema guardado antes del primer render para evitar destello.
      ;(function () {
        try {
          var t = localStorage.getItem('softrent-theme')
          if (
            t === 'dark' ||
            (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)
          ) {
            document.documentElement.dataset.theme = 'dark'
          }
        } catch (e) {
          /* sin localStorage se queda en el tema claro */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
