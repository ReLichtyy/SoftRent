server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback SPA: react-router usa createBrowserRouter,
    # toda ruta debe resolverse en index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre: cache agresiva.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagenes publicas sin hash: cache larga con revalidacion.
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Nunca cachear el shell de la app.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
